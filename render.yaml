services:
  - type: web
    name: vaultify
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TOTP_ENC_KEY
        generateValue: true
      - key: SALT_PEPPER
        generateValue: true
